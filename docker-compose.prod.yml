# ══════════════════════════════════════════════════════════════
# EVERBRILLIANT — Production Docker Compose
# Server: 187.127.88.138 (Hostinger VPS)
# ══════════════════════════════════════════════════════════════
version: '3.9'

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eb_postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${DB_NAME:-everbrilliant}
      POSTGRES_USER: ${DB_USER:-ebuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [eb_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ebuser} -d ${DB_NAME:-everbrilliant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No external port exposure in production
    expose: ["5432"]

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eb_redis
    <<: [*restart, *logging]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks: [eb_internal]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
      args:
        - NODE_ENV=production
    image: everbrilliant-api:${VERSION:-latest}
    container_name: eb_api
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-ebuser}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-everbrilliant}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [eb_internal]
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Web ───────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${API_URL}
    image: everbrilliant-web:${VERSION:-latest}
    container_name: eb_web
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${API_URL}
    depends_on:
      api: { condition: service_healthy }
    networks: [eb_internal]
    expose: ["3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: eb_nginx
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - eb_internal
      - eb_external
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  eb_internal:
    driver: bridge
    internal: true      # No direct internet access
  eb_external:
    driver: bridge
