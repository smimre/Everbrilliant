version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: everbrilliant
      POSTGRES_USER: ebuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-EverB2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [eb_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebuser -d everbrilliant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eb_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks: [eb_net]

  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    container_name: eb_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ebuser:${DB_PASSWORD:-EverB2024}@postgres:5432/everbrilliant
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3001}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [eb_net]

  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    container_name: eb_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://api:3000}
    ports: ["3001:3001"]
    depends_on: [api]
    networks: [eb_net]

  nginx:
    image: nginx:alpine
    container_name: eb_nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, web]
    networks: [eb_net]

volumes:
  postgres_data:
  redis_data:

networks:
  eb_net:
    driver: bridge
